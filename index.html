<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO High Learn | CRM Academy</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0fa;background:#0b1020}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}a{color:#91c9ff}aside{position:fixed;inset:0 auto 0 0;width:300px;background:#101a2c;border-right:1px solid #29364c;padding:24px 15px;overflow:auto}.brand{font-size:23px;font-weight:850;letter-spacing:-.8px;margin:0 10px 6px}.sub{color:#9daec8;font-size:12px;margin:0 10px 20px}.nav{width:100%;text-align:left;border:0;border-radius:11px;background:transparent;color:#aabbd3;padding:12px 13px;margin:2px 0;line-height:1.4}.nav:hover,.nav.active{background:#1d3152;color:white}.nav small{display:block;color:#7f98ba;margin-bottom:3px}main{margin-left:300px;max-width:1200px;padding:42px 6vw 80px}.eyebrow{color:#69dfb6;font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:750}h1{font-size:clamp(30px,4vw,52px);line-height:1.12;margin:12px 0 14px;letter-spacing:-1.5px}h2{font-size:25px;margin:28px 0 14px}h3{font-size:18px;margin:22px 0 8px}p,li{color:#b5c5dc;line-height:1.75}.hero{padding:32px;border-radius:20px;background:linear-gradient(125deg,#1b3154,#10243b 70%,#103a3a);border:1px solid #375078}.muted{color:#9caec7}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:23px 0}.stat,.panel{border:1px solid #2a3b55;background:#121e32;border-radius:15px;padding:20px}.stat b{font-size:26px;display:block}.stat span{font-size:12px;color:#98aac6}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0}input,textarea{background:#101c30;color:#fff;border:1px solid #3b4d67;border-radius:10px;padding:12px;width:100%}textarea{min-height:110px}.primary{background:#65dcb2;color:#08241b;border:0;border-radius:10px;padding:12px 18px;font-weight:800}.secondary{background:#223655;color:#d6e6fa;border:1px solid #425b7a;border-radius:10px;padding:10px 14px}.lesson{border:1px solid #2a3b55;background:#131f33;border-radius:15px;padding:21px;margin:12px 0}.lesson h3{margin:0 0 7px}.pill{font-size:11px;color:#a7ddff;border:1px solid #3e6985;border-radius:99px;padding:5px 9px;display:inline-block;margin-right:6px}.steps{padding-left:22px}.steps li{padding:5px 0}.check{display:flex;gap:11px;align-items:flex-start;padding:10px;background:#18273d;border-radius:9px;margin:8px 0}.check input{width:auto;margin-top:6px}.notice{border-left:3px solid #65dcb2;padding:13px 16px;background:#182b38;color:#c9e6e1;border-radius:5px;margin:16px 0}.warn{border-left-color:#e9bb64;background:#30291f}.resource{display:block;margin:8px 0}.footer{color:#7187a3;font-size:12px;margin-top:50px}.searchresult{cursor:pointer}.progress{height:8px;background:#304057;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#65dcb2;transition:width .2s}.menu{display:none}@media(max-width:850px){aside{display:none;position:static;width:100%;max-height:360px;border-right:0;border-bottom:1px solid #29364c}aside.show{display:block}main{margin:0;padding:20px}.menu{display:inline-block;margin:14px 20px 0}.grid{grid-template-columns:1fr}.hero{padding:22px}}
</style></head><body><button class="menu secondary" onclick="document.querySelector('aside').classList.toggle('show')">☰ Chapters</button><aside><div class="brand">⚡ GO High Learn</div><div class="sub">The CRM Empire Academy · v1.0</div><button class="nav active" id="homeNav" onclick="home()">⌂ &nbsp; Learning dashboard</button><div id="nav"></div><p class="sub">Built to learn the platform first. No live CRM connection or credentials stored.</p></aside><main id="app"></main><script>
const modules=[
{title:'Orientation & Account Structure',tag:'Start here',intro:'Learn the difference between an agency and a sub-account and how to inspect an existing business safely.',steps:['Log in to Isaac’s sub-account and identify the current account name.','Locate Settings, My Staff, Business Profile and Integrations.','Write down who owns the agency subscription and what permissions your login has.','Do not change any live automations while exploring.'],exercise:'Create an account map: agency owner → sub-account → users → integrations.',terms:'Agency, sub-account, roles, permissions, system of record',links:[['HighLevel Help Center','https://help.gohighlevel.com/']]},
{title:'Plans, Pricing & Usage',tag:'Budget',intro:'Compare subscription costs separately from communication, AI, and marketplace usage. Verify prices before buying.',steps:['Check who pays for Isaac’s current account.','Compare Starter, Unlimited and the current higher-tier plan on the official pricing page.','Check API entitlement and limits for the exact account and endpoints.','Review SMS, email, telephony, AI, premium actions and optional app charges.'],exercise:'Create a monthly budget with subscription, communication, AI, and add-on line items.',terms:'Starter, Unlimited, API limits, rebilling, usage billing',links:[['Official pricing','https://www.gohighlevel.com/pricing']]},
{title:'Navigation & Settings',tag:'Foundations',intro:'Get comfortable with the HighLevel menus before touching live business processes.',steps:['Find Contacts, Conversations, Opportunities, Calendars, Automation, Sites and Reporting.','Open each area and note what it contains.','Find Business Profile and integrations under Settings.','Document which menus your role cannot access.'],exercise:'Draw a menu map and identify where a lead enters, moves, and is reported.',terms:'LaunchPad, Conversations, Opportunities, Settings',links:[['Help Center','https://help.gohighlevel.com/']]},
{title:'Contacts, Tags & Custom Fields',tag:'CRM data',intro:'Understand how the existing ~1,500 contacts are organized and how their information enters the CRM.',steps:['Inspect one test or authorized contact.','Identify contact source, tags, custom fields, activities and conversations.','Compare tags versus custom fields: flexible labels versus structured values.','Check duplicate handling before importing any data.'],exercise:'Create a field inventory: name, type, source, purpose, destination, owner.',terms:'Contact, tag, custom field, smart list, deduplication',links:[['Help Center','https://help.gohighlevel.com/']]},
{title:'Opportunities & Pipelines',tag:'Sales lifecycle',intro:'Trace Isaac’s actual customer journey: inquiry → qualification → pitch → close → onboarding.',steps:['Open Opportunities and identify each pipeline.','Write down the stages in order, without renaming them.','Inspect an authorized example opportunity and its linked contact.','Identify what moves the opportunity automatically and what Isaac updates manually.'],exercise:'Map a single lead from first inquiry through sale, including handoffs and bottlenecks.',terms:'Pipeline, opportunity, stage, won, lost, conversion',links:[['Help Center','https://help.gohighlevel.com/']]},
{title:'Workflow Automation',tag:'Core skill',intro:'Read workflows like warehouse process maps: trigger → filter → action → wait → outcome.',steps:['Open Automation → Workflows.','List active, draft and paused workflows.','Inspect one workflow’s trigger, conditions, actions and execution history.','Clone or create a test workflow; keep it unpublished until reviewed.','Test with a dummy contact and inspect logs.'],exercise:'Document one workflow: owner, purpose, trigger, actions, dependencies, status and test result.',terms:'Trigger, action, condition, wait, execution log, workflow map',links:[['HighLevel Help Center','https://help.gohighlevel.com/']]},
{title:'Facebook & Instagram',tag:'Social connections',intro:'Connect Meta accounts only with proper permissions and distinguish lead forms from messages.',steps:['Confirm the correct Facebook Page and Meta Business ownership.','Confirm Instagram is a professional account linked to the intended Page where required.','In HighLevel Settings → Integrations, review Meta connection status.','Map a test lead form to HighLevel fields and verify attribution.','Test supported message workflows separately from lead capture.'],exercise:'Record source → form → contact fields → workflow → opportunity stage.',terms:'Meta Business, Facebook Page, Instagram professional, lead ads, permissions',links:[['Meta Business Help','https://www.facebook.com/business/help'],['HighLevel Help','https://help.gohighlevel.com/']]},
{title:'TikTok Lead Generation',tag:'Social connections',intro:'Learn TikTok Business/Ads lead capture and verify which native integration features are available.',steps:['Identify TikTok Business and Ads account owners.','Review TikTok integration options in the current HighLevel sub-account.','Check lead form field mapping and permission requirements.','Run a test lead and confirm its contact record and attribution.'],exercise:'Document TikTok lead intake, deduplication, follow-up and reporting.',terms:'TikTok Ads, instant forms, lead sync, attribution',links:[['TikTok Business Help','https://ads.tiktok.com/help/'],['HighLevel Help','https://help.gohighlevel.com/']]},
{title:'OpenAI Inside HighLevel',tag:'AI automation',intro:'Use native AI workflow actions before adding custom API calls. Review pricing and customer-data safeguards.',steps:['Check available GPT/AI actions in Automation → Workflows.','Create a draft test workflow triggered by a test form submission.','Ask AI to classify a training inquiry and draft a response.','Save results internally; do not automatically message customers.','Measure execution charges and review accuracy before rollout.'],exercise:'Test five fictional lead inquiries and compare classifications and reply drafts.',terms:'Prompt, tokens, GPT action, AI Employee, human review',links:[['HighLevel Help','https://help.gohighlevel.com/'],['OpenAI API Pricing','https://openai.com/api/pricing/']]},
{title:'ChatGPT ↔ HighLevel',tag:'Integration',intro:'Investigate official OAuth/MCP or supported plugin connection; actual availability depends on your account and ChatGPT workspace.',steps:['Check the ChatGPT plugin directory for an official HighLevel connection.','Review HighLevel developer documentation for supported MCP/OAuth options.','Use OAuth authorization when supported, with least-privilege scopes.','Start with read-only contacts and opportunities tests.','Never paste API secrets into chat or this academy site.'],exercise:'Write a read-only test checklist: list contacts, list pipelines, inspect opportunity, no mutations.',terms:'OAuth, MCP, scopes, API, read-only, token rotation',links:[['HighLevel Developer Docs','https://marketplace.gohighlevel.com/docs/'],['ChatGPT Plugins','https://chatgpt.com/plugins']]},
{title:'Forms, Calendars & Conversations',tag:'Customer journey',intro:'Connect the intake experience to appointment scheduling and follow-up.',steps:['Inventory forms, surveys, calendars and booking links.','Identify where each submission creates or updates contacts.','Inspect reminders, missed appointment logic and opt-out handling.','Use dummy submissions to validate the full path.'],exercise:'Build a lifecycle diagram from form submission to consultation booking.',terms:'Form, calendar, appointment, conversation, consent',links:[['HighLevel Help','https://help.gohighlevel.com/']]},
{title:'Payments, Pricing & Reporting',tag:'Revenue',intro:'Understand the business-side metrics Isaac cares about without disrupting his sales process.',steps:['Identify products, offers, invoices, subscriptions and payment provider.','Inspect reporting for lead sources, appointments, conversion and revenue.','Trace each KPI to its originating records.','Compare dashboard metrics against actual examples before trusting totals.'],exercise:'Define five KPIs: leads, consultations, close rate, revenue, retention.',terms:'Invoice, subscription, attribution, close rate, dashboard',links:[['HighLevel Help','https://help.gohighlevel.com/']]},
{title:'Security, Audit & Troubleshooting',tag:'Operations',intro:'Protect a live business while learning: access control, test records, change logs and rollback.',steps:['Review user roles and integration scopes.','Rotate any API tokens previously shared in insecure contexts.','Keep a change log for every workflow modification.','Use draft mode, test contacts and clear rollback steps.','Review workflow failures and communication consent rules.'],exercise:'Create a pre-launch checklist for a new automation and a rollback procedure.',terms:'Least privilege, audit log, rollback, consent, credential rotation',links:[['HighLevel Help','https://help.gohighlevel.com/']]},
{title:'Isaac’s Business — Practical Audit',tag:'Capstone',intro:'Apply the whole academy to the existing personal training CRM without rebuilding capabilities already provided.',steps:['Inventory existing contacts, pipelines, workflows and connected channels.','Interview Isaac on inquiry, pitch, closing and customer relationships.','Trace three real customer journeys with appropriate authorization.','Flag duplicate work, failed automation, missing data and reporting gaps.','Prioritize improvements by business impact and implementation risk.'],exercise:'Deliver a one-page current-state map and a ranked backlog: native configuration first, custom development second.',terms:'Current state, process map, gap analysis, backlog, ROI',links:[['HighLevel Help','https://help.gohighlevel.com/']]}
];
const curatedResources=[['Getting started', 'https://help.gohighlevel.com/support/solutions/155000000204', 'https://www.youtube.com/watch?v=TLZZx82Bl9Q'], ['HighLevel pricing', 'https://www.gohighlevel.com/pricing', 'https://www.youtube.com/results?search_query=GoHighLevel+pricing+plans+explained+2026'], ['Getting started', 'https://help.gohighlevel.com/support/solutions/155000000204', 'https://www.youtube.com/watch?v=TLZZx82Bl9Q'], ['Create and manage contacts', 'https://help.gohighlevel.com/support/solutions/155000000204', 'https://www.youtube.com/results?search_query=GoHighLevel+contacts+tags+custom+fields+tutorial'], ['Pipelines and opportunities guide', 'https://help.gohighlevel.com/support/solutions/articles/155000005062/', 'https://www.youtube.com/watch?v=TLZZx82Bl9Q&t=683s'], ['Workflow automation examples', 'https://help.gohighlevel.com/support/solutions/articles/155000002055-guide-to-facebook-instagram-comment-automation-ai', 'https://www.youtube.com/watch?v=TLZZx82Bl9Q&t=975s'], ['Facebook & Instagram automation guide', 'https://help.gohighlevel.com/support/solutions/articles/155000002055-guide-to-facebook-instagram-comment-automation-ai', 'https://www.youtube.com/results?search_query=HighLevel+Facebook+Instagram+lead+ads+integration+tutorial'], ['Social Planner setup [includes TikTok]', 'https://help.gohighlevel.com/support/solutions/articles/155000005063', 'https://www.youtube.com/results?search_query=GoHighLevel+TikTok+integration+lead+ads+tutorial'], ['OpenAI workflow action example', 'https://help.gohighlevel.com/support/solutions/articles/155000002055-guide-to-facebook-instagram-comment-automation-ai', 'https://www.youtube.com/results?search_query=GoHighLevel+ChatGPT+OpenAI+workflow+action+tutorial'], ['HighLevel developer documentation', 'https://marketplace.gohighlevel.com/docs/', 'https://www.youtube.com/results?search_query=HighLevel+API+OAuth+MCP+integration+tutorial'], ['Forms, calendars and conversations', 'https://help.gohighlevel.com/support/solutions/155000000204', 'https://www.youtube.com/results?search_query=GoHighLevel+forms+calendars+conversations+tutorial'], ['HighLevel commerce and payments', 'https://help.gohighlevel.com/support/solutions/155000000204', 'https://www.youtube.com/results?search_query=GoHighLevel+payments+reporting+dashboard+tutorial'], ['HighLevel support knowledge base', 'https://help.gohighlevel.com/support/solutions', 'https://www.youtube.com/results?search_query=GoHighLevel+workflow+troubleshooting+permissions+tutorial'], ['Pipeline setup and lead lifecycle', 'https://help.gohighlevel.com/support/solutions/articles/155000005062/', 'https://www.youtube.com/watch?v=EJQTskocuvs']];
const key='gohighlearn_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};const state={completed:saved.completed||[],notes:saved.notes||{},checks:saved.checks||{},current:0};const persist=()=>localStorage.setItem(key,JSON.stringify({completed:state.completed,notes:state.notes,checks:state.checks}));const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderNav(){document.getElementById('nav').innerHTML=modules.map((m,i)=>`<button class="nav ${state.current===i?'active':''}" onclick="lesson(${i})"><small>MODULE ${String(i+1).padStart(2,'0')} ${state.completed.includes(i)?'✓':''}</small>${escapeHtml(m.title)}</button>`).join('')};
function home(){state.current=-1;document.getElementById('homeNav').classList.add('active');renderNav();let pct=Math.round(state.completed.length/modules.length*100);document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Welcome to the CRM empire</div><h1>Learn the platform.<br>Then build the empire.</h1><p>One searchable home for our HighLevel journey — native CRM first, custom code only when it solves a real gap.</p><button class="primary" onclick="lesson(${modules.findIndex((_,i)=>!state.completed.includes(i))<0?0:modules.findIndex((_,i)=>!state.completed.includes(i))})">Continue learning →</button></section><div class="grid"><div class="stat"><b>${modules.length}</b><span>Indexed modules</span></div><div class="stat"><b>${state.completed.length}</b><span>Completed modules</span></div><div class="stat"><b>${pct}%</b><span>Overall progress</span><div class="progress"><div style="width:${pct}%"></div></div></div></div><div class="toolbar"><input id="search" placeholder="Search chapters, topics, terminology…" oninput="search(this.value)" aria-label="Search chapters"></div><div id="results">${modules.map((m,i)=>card(m,i)).join('')}</div><div class="notice">Learning-only mode: This website does not connect to Isaac’s live CRM. Notes and progress are saved locally in this browser. Export your notes regularly.</div><button class="secondary" onclick="exportNotes()">Export my notes & progress</button><p class="footer">GO High Learn v1.1 · Independent training academy · Links and plan details should be checked against current official documentation.</p>`};
function card(m,i){return `<div class="lesson searchresult" onclick="lesson(${i})"><span class="pill">MODULE ${String(i+1).padStart(2,'0')}</span><span class="pill">${escapeHtml(m.tag)}</span><h3>${escapeHtml(m.title)} ${state.completed.includes(i)?'✓':''}</h3><p>${escapeHtml(m.intro)}</p><button class="secondary">Open lesson →</button></div>`}
function search(q){const terms=q.toLowerCase().trim();document.getElementById('results').innerHTML=modules.map((m,i)=>({m,i})).filter(({m})=>(m.title+' '+m.tag+' '+m.intro+' '+m.terms+' '+m.steps.join(' ')).toLowerCase().includes(terms)).map(({m,i})=>card(m,i)).join('')||'<p>No matching lessons. Try another term.</p>'}
function lesson(i){state.current=i;document.getElementById('homeNav').classList.remove('active');renderNav();const m=modules[i];document.getElementById('app').innerHTML=`<button class="secondary" onclick="home()">← Dashboard</button><p class="eyebrow">Module ${String(i+1).padStart(2,'0')} of ${modules.length} · ${escapeHtml(m.tag)}</p><h1>${escapeHtml(m.title)}</h1><p>${escapeHtml(m.intro)}</p><div class="notice">Learning objective: understand the current configuration before making changes. Verify permissions and current documentation.</div><h2>Step-by-step walkthrough</h2><ol class="steps">${m.steps.map((s,j)=>`<li><label class="check"><input type="checkbox" ${((state.checks[i]||[]).includes(j))?'checked':''} onchange="toggleStep(${i},${j},this.checked)"><span>${escapeHtml(s)}</span></label></li>`).join('')}</ol><div class="panel"><h2>🛠 Hands-on exercise</h2><p>${escapeHtml(m.exercise)}</p><h3>Key vocabulary</h3><p>${escapeHtml(m.terms)}</p></div><h2>Official resources</h2>${m.links.map(([name,url])=>`<a class="resource" target="_blank" rel="noopener noreferrer" href="${url}">↗ ${escapeHtml(name)}</a>`).join('')}<h2>📚 Learn · Watch · Practice</h2><div class="panel"><p class="muted">Official documentation and a video walkthrough or YouTube tutorial search, matched to this module. External links open in a new tab.</p><a class="resource" target="_blank" rel="noopener noreferrer" href="${curatedResources[i][1]}">📖 Official guide: ${escapeHtml(curatedResources[i][0])} ↗</a><a class="resource" target="_blank" rel="noopener noreferrer" href="${curatedResources[i][2]}">▶ ${curatedResources[i][2].includes('/results?')?'Find YouTube tutorials for this topic':'Watch a relevant YouTube tutorial'} ↗</a><p><strong>Practice:</strong> ${escapeHtml(m.exercise)}</p><p class="muted">Video search results are suggestions, not individually verified tutorials. Confirm feature availability in your sub-account before making changes.</p></div><h2>My learning journal</h2><p class="muted">Record discoveries, questions, and screenshots references. Saved in this browser only.</p><textarea id="notes" placeholder="What did I discover? What should Morrie help me investigate next?">${escapeHtml(state.notes[i]||'')}</textarea><div class="toolbar"><button class="secondary" onclick="saveNotes(${i})">Save notes</button><button class="primary" onclick="toggleDone(${i})">${state.completed.includes(i)?'✓ Completed — mark incomplete':'Mark module complete ✓'}</button></div><div class="toolbar"><button class="secondary" onclick="lesson(${Math.max(0,i-1)})" ${i===0?'disabled':''}>← Previous</button><button class="secondary" onclick="lesson(${Math.min(modules.length-1,i+1)})" ${i===modules.length-1?'disabled':''}>Next module →</button></div><p class="footer">Progress is stored on this device. Export a backup from the dashboard.</p>`;window.scrollTo(0,0)}
function toggleStep(i,j,v){let a=state.checks[i]||[];state.checks[i]=v?[...new Set([...a,j])]:a.filter(n=>n!==j);persist()};function saveNotes(i){state.notes[i]=document.getElementById('notes').value;persist();alert('Notes saved on this device.')};function toggleDone(i){state.notes[i]=document.getElementById('notes').value;state.completed=state.completed.includes(i)?state.completed.filter(n=>n!==i):[...state.completed,i];persist();lesson(i)};function exportNotes(){const data=JSON.stringify({exportedAt:new Date().toISOString(),modules:modules.map((m,i)=>({module:i+1,title:m.title,completed:state.completed.includes(i),stepsChecked:state.checks[i]||[],notes:state.notes[i]||''}))},null,2);const blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='go-high-learn-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}home();
</script></body></html>
